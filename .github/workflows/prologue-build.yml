name: Amaze Prologue Play Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.PROLOGUE_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import os
          import base64

          value = os.environ["KEYSTORE_BASE64"]
          value = "".join(value.split()).strip('"').strip("'")
          data = base64.b64decode(value)
          with open("prologue-upload-key.jks", "wb") as f:
              f.write(data)

          print(f"Restored keystore: {len(data)} bytes")
          PY

      - name: Create signing properties
        env:
          STORE_PASSWORD: ${{ secrets.PROLOGUE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PROLOGUE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PROLOGUE_KEY_PASSWORD }}
        run: |
          cat > signing.properties <<EOF
          STORE_FILE=../prologue-upload-key.jks
          STORE_PASSWORD=$STORE_PASSWORD
          KEY_ALIAS=$KEY_ALIAS
          KEY_PASSWORD=$KEY_PASSWORD
          EOF

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build signed Play release bundle
        run: ./gradlew bundlePlayRelease --stacktrace

      - name: Find generated bundles
        if: always()
        run: find . -type f -name "*.aab" -print

      - name: Upload signed AAB
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Prologue-Play-Release-AAB
          path: app/build/outputs/bundle/playRelease/*.aab
          if-no-files-found: error
