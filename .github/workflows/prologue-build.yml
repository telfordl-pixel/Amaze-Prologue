name: Amaze Prologue Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Verify build tools
        run: |
          java -version
          python3 --version
          rustc --version
          cargo --version
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build Amaze debug APK
        run: ./gradlew assembleFdroidDebug --stacktrace

      - name: Find generated APKs
        if: always()
        run: find . -type f -name "*.apk" -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Amaze-Prologue-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
